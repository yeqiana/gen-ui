<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交付清单</title><link rel="stylesheet" href="../section.css"><link rel="icon" type="image/svg+xml" href="../../../assets/icons/gen-ui-mark.svg"></head><body>
<h1>交付清单</h1><p>可将多页面入口作为工程验收报告的首页，继续使用已有独立业务 HTML 文件。</p>
<h2 id="files">集成内容</h2><ul><li>根目录的工作区概览</li><li>质量目录下的状态和明细</li><li>交付目录下的本清单</li></ul>
<h2 id="acceptance">手动验收</h2><ul><li>点击左侧任一页面，iframe 内容切换且不离开主入口</li><li>折叠/展开目录；窄屏点击目录按钮后可以关闭</li><li>导航中的小标题定位至对应 HTML 的已有锚点</li></ul>
<p class="note">本页属于说明示例，没有调用任何后端或网络服务。</p></body></html>
