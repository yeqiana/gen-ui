<style>:root{color-scheme:light;font:14px/1.55 "Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--ink:#252525;--muted:#737373;--line:#ececec;--paper:#fff;--hover:#f5f5f5;--frame:#fafafa;--focus:#333}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink)}
button,a{font:inherit}a{color:inherit}
button{cursor:pointer}button:focus-visible,a:focus-visible,iframe:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;left:12px;top:-60px;z-index:50;background:white;padding:8px 12px}.skip-link:focus{top:8px}
.portal{display:grid;grid-template-columns:244px minmax(0,1fr);height:100dvh;min-height:320px}
.rail{min-width:0;display:flex;flex-direction:column;background:#fafafa;border-right:1px solid var(--line);height:100dvh;min-height:320px;overflow:hidden}
.rail-head{height:70px;padding:18px 15px 16px 21px;display:flex;gap:10px;align-items:center;flex-shrink:0}
.mark{display:flex;color:#242424;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0}
.mark svg,.workspace-brand-mark svg,.rail-foot-mark svg{display:block;width:100%;height:100%}
.workspace-brand-mark{display:inline-flex;align-items:center;justify-content:center;flex:0 0 20px;width:20px;height:20px}
.rail-foot-label{display:inline-flex;align-items:center;gap:7px;min-width:0}
.rail-foot-mark{display:inline-flex;align-items:center;justify-content:center;flex:0 0 16px;width:16px;height:16px}
.rail-foot-text{white-space:nowrap}
.rail-name{font-size:14px;letter-spacing:.065em;font-weight:760;white-space:nowrap}
.icon-button{border:0;background:transparent;border-radius:7px;color:#777;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:23px}
.icon-button:hover{background:#eaeaea;color:#222}
.rail-close{margin-left:auto;font-size:24px}
#page-nav{padding:9px 10px 10px 14px;overflow:auto;min-height:0;flex:1;scrollbar-width:thin}
.group{margin:8px 0 13px}.group summary{list-style:none;display:flex;align-items:center;gap:7px;font-size:11px;color:#858585;font-weight:650;letter-spacing:.035em;padding:9px 10px;cursor:pointer}
.group summary::-webkit-details-marker{display:none}.group summary::before{content:"";width:5px;height:5px;border-right:1px solid #888;border-bottom:1px solid #888;transform:rotate(-45deg);transition:transform .15s}
.group[open] summary::before{transform:rotate(45deg)}.group-children{padding-left:9px;border-left:1px solid #e5e5e5;margin-left:13px}
.page-link,.section-link{display:flex;gap:10px;align-items:center;width:100%;border:0;border-radius:6px;background:transparent;text-align:left;color:#5b5b5b;padding:9px 10px;margin:2px 0;font-size:13px;line-height:1.35}
.page-link:hover,.section-link:hover{background:#ededed;color:#242424}
.page-link[aria-current="page"],.section-link[aria-current="location"]{background:#ececec;color:#1c1c1c;font-weight:650}
.nav-glyph{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-glyph{position:relative}
.nav-glyph::after{content:"";width:11px;height:14px;border:1.5px solid currentColor;border-radius:2px;box-shadow:inset 0 -3px 0 -2px currentColor}
.nav-glyph[data-kind="overview"]::after{width:12px;height:12px;border:1.5px solid currentColor;border-radius:50%;box-shadow:none}
.nav-glyph[data-kind="overview"]::before{content:"";position:absolute;top:5px;left:9px;width:6px;height:6px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-20deg)}
.nav-glyph[data-kind="table"]::after{width:12px;height:12px;border:1.5px solid currentColor;border-radius:2px;box-shadow:inset 0 -4px 0 -3px currentColor}
.nav-glyph[data-kind="table"]::before{content:"";position:absolute;top:3px;bottom:3px;left:9px;width:1px;background:currentColor;opacity:.7}
.nav-glyph[data-kind="status"]::after{width:13px;height:13px;border:1.5px solid currentColor;border-radius:50%;box-shadow:none}
.nav-glyph[data-kind="status"]::before{content:"";position:absolute;width:7px;height:4px;border-bottom:1.5px solid currentColor;border-left:1.5px solid currentColor;transform:rotate(-45deg);top:5px;left:6px}
.nav-glyph[data-kind="delivery"]::after{width:11px;height:14px;border:1.5px solid currentColor;border-radius:2px;box-shadow:none}
.nav-glyph[data-kind="delivery"]::before{content:"";position:absolute;width:5px;height:1.5px;background:currentColor;top:9px;left:6px}
.section-link{margin-left:22px;width:calc(100% - 22px);font-size:12px;color:#777;padding-block:6px}
.section-link::before{content:"";width:4px;height:4px;background:#aeaeae;border-radius:100%}
.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:14px 22px;color:#999;font-size:11px}
.workspace{min-width:0;min-height:0;display:flex;flex-direction:column;background:white}
.workspace-header{min-height:62px;display:flex;align-items:center;gap:18px;padding:11px clamp(18px,3vw,48px);border-bottom:1px solid #f1f1f1}
.workspace-titles{min-width:0;flex:1}.workspace-overline{color:#757575;font-size:12px;margin:0;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.workspace-header h1{font-size:19px;font-weight:600;margin:0;line-height:1.3;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.preview-mode{display:inline-block;color:#898989;font-size:10px;margin:0;white-space:nowrap}
.open-new{font-size:12px;color:#5e5e5e;text-decoration:none;white-space:nowrap}.open-new:hover{text-decoration:underline;color:#222}
.frame-area{position:relative;min-height:0;flex:1;background:var(--frame);padding:0}
#page-frame{display:block;height:100%;width:100%;border:0;background:white}
.frame-status{position:absolute;bottom:8px;right:12px;margin:0;color:#888;background:rgba(255,255,255,.9);padding:3px 7px;font-size:10px;pointer-events:none}
.menu-button{display:none}
.portal.is-collapsed{grid-template-columns:68px minmax(0,1fr)}
.is-collapsed .rail-head{min-height:70px;height:auto;padding:14px 0;justify-content:center;flex-direction:column;flex-wrap:nowrap;gap:12px}
.is-collapsed .rail-name,.is-collapsed .rail-foot,.is-collapsed .label,.is-collapsed .group summary,.is-collapsed .section-link{display:none}
.is-collapsed .mark{width:30px;height:30px}
.is-collapsed #page-nav{padding:10px 5px}
.is-collapsed .page-link{justify-content:center;padding:10px 0;width:48px;height:42px;margin:4px auto;min-width:0;gap:0}
.is-collapsed .nav-glyph{width:18px;height:18px}
.is-collapsed .rail-close{margin:0;width:40px;height:40px}
.is-collapsed .group{margin:2px 0}
.is-collapsed .group-children{border:0;padding:0;margin:0}
.mobile-backdrop{display:none}
@media(max-width:700px){
.portal,.portal.is-collapsed{display:block}.rail{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(286px,87vw);height:100dvh;transform:translateX(-105%);transition:transform .18s ease;box-shadow:8px 0 28px #0000000a}
.portal.mobile-open .rail{transform:translateX(0)}.portal.mobile-open .mobile-backdrop{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.23)}
.portal.is-collapsed .rail{width:min(286px,87vw)}.portal.is-collapsed .label,.portal.is-collapsed .rail-name,.portal.is-collapsed .group summary,.portal.is-collapsed .section-link,.portal.is-collapsed .rail-count,.portal.is-collapsed .rail-foot-text{display:initial}
.portal.is-collapsed .rail-head{height:70px;justify-content:flex-start;flex-direction:row;flex-wrap:nowrap}.portal.is-collapsed .page-link{justify-content:flex-start;padding:9px 10px}
.menu-button{display:inline-flex}.workspace{height:100dvh}.workspace-header{min-height:56px;padding:9px 15px;gap:12px}.workspace-header h1{font-size:16px}.open-new{font-size:11px}.frame-status{font-size:9px}
.workspace-header{flex-wrap:wrap;row-gap:5px}
.preview-mode{flex-basis:100%;text-align:right}
}
@media(prefers-reduced-motion:reduce){.rail,.group summary::before{transition:none}}

/* 统一图标：目录与折叠按钮使用同一套矢量描边。 */
.nav-glyph::before,.nav-glyph::after{content:none!important;display:none!important}
.nav-glyph svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icon-button svg{display:block;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail-close[aria-expanded=false] svg{transform:rotate(180deg)}
.page-link[aria-current=page],.section-link[aria-current=location]{background:#ecf5ff;color:#409eff}
.page-link:hover,.section-link:hover{background:#ecf5ff;color:#337ecc}
.icon-button:hover{background:#ecf5ff;color:#409eff}
.is-collapsed .rail-close{width:34px;height:34px}
</style></head><body>

<div class="frame-area"><iframe id="page-frame" title="内容页面" loading="eager" referrerpolicy="no-referrer" sandbox="allow-same-origin" src="about:blank"></iframe><p class="frame-status" id="frame-status" role="status" aria-live="polite"></p></div>

<script type="application/json" id="page-manifest">{"title":"GEN-UI 示例","prefix":"","sourceCount":4,"pages":[{"id":"p1","title":"工作区概览","href":"00-%E6%80%BB%E8%A7%88.html","sections":[{"id":"structure","title":"目录组织"},{"id":"navigation","title":"层级导航"}],"parts":["00-总览.html"]},{"id":"p2","title":"交付清单","href":"%E4%BA%A4%E4%BB%98/%E6%B8%85%E5%8D%95.html","sections":[{"id":"files","title":"集成内容"},{"id":"acceptance","title":"手动验收"}],"parts":["交付","清单.html"]},{"id":"p3","title":"记录明细","href":"%E8%B4%A8%E9%87%8F/%E6%98%8E%E7%BB%86.html","sections":[{"id":"list","title":"记录列表"},{"id":"footnote","title":"口径说明"}],"parts":["质量","明细.html"]},{"id":"p4","title":"质量状态","href":"%E8%B4%A8%E9%87%8F/%E7%8A%B6%E6%80%81.html","sections":[{"id":"summary","title":"状态概览"},{"id":"criteria","title":"验收标准"}],"parts":["质量","状态.html"]}]}</script>
<script>"use strict";
(() => {
const manifest=JSON.parse(document.getElementById("page-manifest").textContent);
const app=document.getElementById("portal");
const rail=document.getElementById("rail");
const nav=document.getElementById("page-nav");
const frame=document.getElementById("page-frame");
// Local file preview: keep same-origin only for CSS, but disable page scripts.
// HTTP preview: allow page scripts in a sandboxed opaque origin; never pair
// allow-scripts with allow-same-origin, even for a user-provided HTML page.
// A copy deployed to an arbitrary web origin must not run untrusted page scripts.
const interactive=location.protocol==="http:"&&location.hostname==="127.0.0.1";
frame.setAttribute("sandbox",interactive?"allow-scripts allow-forms":"allow-same-origin");
document.getElementById("preview-mode").textContent=interactive?"隔离交互预览":"离线静态预览 · 脚本不可用";
const title=document.getElementById("active-title");
const crumb=document.getElementById("breadcrumb");
const external=document.getElementById("open-external");
const status=document.getElementById("frame-status");
const collapse=document.getElementById("collapse");
const menu=document.getElementById("open-nav");
const backdrop=document.getElementById("backdrop");
const pages=manifest.pages;
const active=new Map();
const root={children:new Map(),pages:[]};
const base=manifest.prefix?manifest.prefix+"/":"";
for(const page of pages){
 let node=root;
 for(const segment of page.parts.slice(0,-1)){
   if(!node.children.has(segment))node.children.set(segment,{name:segment,children:new Map(),pages:[]});
   node=node.children.get(segment);
 }
 node.pages.push(page);
}
const make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
function goto(page,section){
 const safeUrl=base+page.href+(section?"#"+encodeURIComponent(section.id):"");
 frame.src=safeUrl;frame.title=page.title+(section?" · "+section.title:"");
 title.textContent=section?section.title:page.title;
 crumb.textContent=[manifest.title,...page.parts.slice(0,-1),page.title].join(" / ");
 external.href=safeUrl;
 external.setAttribute("aria-label","在新标签页打开"+(section?section.title:page.title));
 status.textContent="正在显示 · "+page.title;
 for(const [key,button] of active){
   const on=key===page.id+(section?"#"+section.id:"");
   if(on)button.setAttribute("aria-current",section?"location":"page");
   else button.removeAttribute("aria-current");
 }
 app.classList.remove("mobile-open");menu.setAttribute("aria-expanded","false");backdrop.hidden=true;
}
function iconKind(page){
 const name=[page.title,...page.parts].join(" / ");
 if(/总览|概览|首页|overview|summary/i.test(name))return "overview";
 if(/状态|质量|审核|验收|status|check/i.test(page.title))return "status";
 if(/明细|记录|列表|详情|table|detail/i.test(page.title))return "table";
 if(/交付|发布|清单|release|deliver/i.test(page.title))return "delivery";
 return ["overview","table","status","delivery"][(Number(page.id.slice(1))||1)%4];
}
function navIcon(kind){
 const d={
  overview:"M3 3h5v5H3z M10 3h5v5h-5z M3 10h5v5H3z M10 10h5v5h-5z",
  table:"M3 4h12v10H3z M3 8h12 M8 4v10",
  status:"M9 2a7 7 0 1 0 0 14a7 7 0 0 0 0-14z M5.5 9l2.1 2.1L12 7",
  delivery:"M5 2h6l3 3v11H5z M11 2v4h3 M7 10h5 M7 13h4"
 };
 const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
 svg.setAttribute("viewBox","0 0 18 18");svg.setAttribute("aria-hidden","true");
 const path=document.createElementNS("http://www.w3.org/2000/svg","path");
 path.setAttribute("d",d[kind]||d.overview);svg.append(path);return svg;
}

function buttonFor(page,section){
 const btn=make("button",section?"section-link":"page-link");
 btn.type="button";
 btn.title=section?section.title:page.title;
 const key=page.id+(section?"#"+section.id:"");
 if(!section){const icon=make("span","nav-glyph");icon.dataset.kind=iconKind(page);icon.setAttribute("aria-hidden","true");icon.append(navIcon(icon.dataset.kind));btn.append(icon)}
 const label=make("span","label",section?section.title:page.title);btn.append(label);
 btn.setAttribute("aria-label",(section?"定位小节：":"打开页面：")+(section?section.title:page.title));
 btn.addEventListener("click",()=>goto(page,section));
 active.set(key,btn);
 return btn;
}
function render(node,parent){
 for(const page of node.pages){
   parent.append(buttonFor(page));
   for(const section of page.sections)parent.append(buttonFor(page,section));
 }
 for(const [name,child] of node.children){
   const details=make("details","group");details.open=true;
   const summary=make("summary","",name);details.append(summary);
   const content=make("div","group-children");details.append(content);
   render(child,content);parent.append(details);
 }
}
render(root,nav);document.getElementById("page-count").textContent=pages.length+" 个页面";
frame.addEventListener("load",()=>{status.textContent="";});
const small=()=>matchMedia("(max-width:700px)").matches;
collapse.addEventListener("click",()=>{
 if(small()){
   app.classList.remove("mobile-open");menu.setAttribute("aria-expanded","false");backdrop.hidden=true;menu.focus();return;
 }
 app.classList.toggle("is-collapsed");
 const expanded=!app.classList.contains("is-collapsed");
 collapse.setAttribute("aria-expanded",String(expanded));
 collapse.title=expanded?"折叠目录":"展开目录";
 collapse.setAttribute("aria-label",collapse.title);
});
menu.addEventListener("click",()=>{
 const show=!app.classList.contains("mobile-open");
 app.classList.toggle("mobile-open",show);menu.setAttribute("aria-expanded",String(show));backdrop.hidden=!show;
 if(show)rail.querySelector("summary,button")?.focus();
});
backdrop.addEventListener("click",()=>{app.classList.remove("mobile-open");menu.setAttribute("aria-expanded","false");backdrop.hidden=true;menu.focus()});
window.addEventListener("keydown",e=>{if(e.key==="Escape"&&app.classList.contains("mobile-open")){app.classList.remove("mobile-open");menu.setAttribute("aria-expanded","false");backdrop.hidden=true;menu.focus()}});
if(pages.length)goto(pages[0]);
else{frame.src="about:blank";title.textContent="暂无内容";status.textContent="没有可展示的 HTML 页面"}
})();
</script></body></html>
