<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN-UI · 独立业务图表边界案例</title><link rel="icon" href="../assets/icons/gen-ui-mark.svg"><link rel="stylesheet" href="../assets/semantic-diagrams.css"><script src="../assets/semantic-diagrams.js" defer></script><style>body{margin:0;color:#1a1c1f;font:14px/1.5 system-ui;background:#fff}main{max-width:1260px;margin:0 auto;padding:24px}h1{font-size:24px}.genui-semantic-diagram{margin:18px 0}@media(max-width:760px){main{padding:12px}}</style></head><body><main><h1>独立业务模型 · 边界验收</h1><p>固定示例之外的模型，用于测试布局、路径语义、重复关系和生命周期。非真实业务审计。</p><section class="genui-semantic-diagram" data-semantic-diagram="sequence"><script type="application/json" data-diagram-model>{"title":{"zh":"自定义四方业务时序","en":"Four-participant sequence"},"desc":{"zh":"在300宽画布配置下验证四方动态布局。","en":"Check dynamic layout with a requested 300-wide canvas."},"canvas":{"width":300,"height":300},"participants":[{"id":"requester","name":{"zh":"请求者","en":"Requester"},"sub":{"zh":"参与方","en":"Actor"}},{"id":"api","name":{"zh":"API","en":"API"},"sub":{"zh":"参与方","en":"Actor"}},{"id":"worker","name":{"zh":"Worker","en":"Worker"},"sub":{"zh":"参与方","en":"Actor"}},{"id":"store","name":{"zh":"Store","en":"Store"},"sub":{"zh":"参与方","en":"Actor"}}],"messages":[{"from":"requester","to":"api","label":{"zh":"创建订单","en":"Create order"},"kind":"sync"},{"from":"api","to":"worker","label":{"zh":"任务分配","en":"Dispatch task"},"kind":"async"},{"from":"worker","to":"store","label":{"zh":"写入记录","en":"Persist record"},"kind":"sync"}]}</script></section><section class="genui-semantic-diagram" data-semantic-diagram="activity"><script type="application/json" data-diagram-model>{"title":{"zh":"自定义活动分支","en":"Custom activity branches"},"desc":{"zh":"拒绝节点使用业务自定义 ID。","en":"Reject-case node has its own business ID."},"canvas":{"width":800,"height":400},"nodes":[{"id":"beginCase","title":{"zh":"Start","en":"Start"},"x":30,"y":150,"w":36,"h":36,"kind":"start"},{"id":"validateCase","title":{"zh":"Validate","en":"Validate"},"x":140,"y":140,"w":150,"h":62,"kind":"action"},{"id":"rejectCase","title":{"zh":"Reject","en":"Reject"},"x":430,"y":285,"w":150,"h":62,"kind":"action"},{"id":"successCase","title":{"zh":"Success","en":"Success"},"x":430,"y":80,"w":150,"h":62,"kind":"action"}],"edges":[{"from":"beginCase","to":"validateCase","label":{"zh":"请求","en":"Request"},"d":"M66 168 H140","lx":108,"ly":120},{"from":"validateCase","to":"rejectCase","path":"retry","label":{"zh":"未通过","en":"Rejected"},"d":"M290 171 V315 H430","lx":365,"ly":285},{"from":"validateCase","to":"successCase","path":"normal","label":{"zh":"通过","en":"Passed"},"d":"M290 171 V110 H430","lx":360,"ly":79}]}</script></section><section class="genui-semantic-diagram" data-semantic-diagram="er"><script type="application/json" data-diagram-model>{"title":{"zh":"重复关系与超长标签","en":"Duplicate relationships and long labels"},"desc":{"zh":"验证同端点两条独立关系和超长文字。","en":"Check two edges sharing endpoints and one overlong label."},"canvas":{"width":760,"height":410},"entities":[{"id":"account","title":"ACCOUNT","x":30,"y":90,"w":180,"h":130,"fields":[["account_id","PK","账户主键","Account key"]]},{"id":"order","title":"ORDER","x":480,"y":90,"w":200,"h":130,"fields":[["order_id","PK","订单主键","Order key"],["account_id","FK","所属账户","Owner"]]}],"relations":[{"from":"account","to":"order","id":"owns","label":"1 : N","d":"M210 141 H480","lx":345,"ly":100},{"from":"account","to":"order","id":"audits","label":"Long relationship description repeated Long relationship description repeated Long relationship description repeated Long relationship description repeated Long relationship description repeated Long relationship description repeated Long relationship description repeated ","d":"M210 200 H480","lx":345,"ly":250}]}</script></section><section class="genui-semantic-diagram" data-semantic-diagram="mind"></section></main></body></html>
