<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gen UI · 本地交互预览</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.65; background: light-dark(#f7f8fb,#10141e); color: light-dark(#172033,#eef1f8); }
    main { max-width: 930px; margin: 0 auto; padding: 36px 20px 64px; }
    header { border-bottom: 1px solid light-dark(#d9e1ee,#303b4b); margin-bottom: 24px; padding-bottom: 20px; }
    .eyebrow { font-size: .82rem; color: light-dark(#455ed9,#a6b4ff); font-weight: 750; letter-spacing: .08em; }
    h1 { font-size: clamp(1.6rem,4vw,2.45rem); margin: 6px 0 8px; line-height: 1.3; }
    h2 { font-size: 1.23rem; margin: 0 0 10px; }
    p { margin: 8px 0; }
    .muted { color: light-dark(#5a667c,#b1bfd0); }
    .layout { display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; }
    section { min-width: 0; }
    .panel { padding: 22px; border: 1px solid light-dark(#dce2ed,#354056); border-radius: 15px; background: light-dark(white,#1b2332); }
    .field { display: grid; gap: 8px; margin: 20px 0; }
    .field-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    output { font-weight: 700; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: #6678ea; }
    dl { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 12px; margin: 20px 0; }
    .metric { padding: 12px 14px; background: light-dark(#f2f4fc,#263348); border-radius: 10px; }
    dt { font-size: .82rem; color: light-dark(#536079,#c2cede); }
    dd { font-size: 1.45rem; font-weight: 750; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
    .note { padding: 10px 14px; border-left: 3px solid #6678ea; background: light-dark(#f3f5fd,#273149); font-size: .9rem; border-radius: 5px; }
    textarea { display: block; width: 100%; min-height: 244px; resize: vertical; padding: 12px; border: 1px solid light-dark(#ccd4e0,#4d5a70); border-radius: 9px; background: light-dark(#fcfdff,#151d2b); color: inherit; font: 12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .actions { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin: 12px 0; }
    button, .file-picker { border: 1px solid #6f7fe6; padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; background: #566be5; color: white; font: inherit; }
    button:hover, .file-picker:hover { filter: brightness(1.08); }
    input[type=file] { max-width: 100%; font-size: .8rem; }
    .status { font-size: .86rem; overflow-wrap:anywhere; }
    .status[data-kind=error] { color: light-dark(#b42318,#ffa399); }
    .fallback { margin-top: 20px; font-size:.92rem; }
    .fallback code { padding: 2px 5px; background:light-dark(#ecf0fa,#2b3850);border-radius:4px; }
    @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } main { padding-top: 24px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">LOCAL GENERATIVE UI · DEMO</div>
      <h1>Gen UI 本地交互预览</h1>
      <p class="muted">一个无需后端的安全组件渲染示例：AI 提供 JSON 数据，浏览器负责验证并渲染。它不是 ChatGPT 的原生 UI 引擎。</p>
    </header>
    <div class="layout">
      <section class="panel" aria-label="生成的交互界面">
        <div id="preview" aria-live="polite"></div>
      </section>
      <section class="panel" aria-labelledby="json-heading">
        <h2 id="json-heading">UI 协议 JSON</h2>
        <p class="muted">编辑受控 JSON，点击“渲染协议”，或从本地选择示例 JSON 文件。</p>
        <label for="spec-input">协议内容</label>
        <textarea id="spec-input" spellcheck="false" aria-describedby="status"></textarea>
        <div class="actions">
          <button id="render-button" type="button">渲染协议</button>
          <input type="file" id="file-input" accept=".json,application/json" aria-label="导入 JSON 文件">
        </div>
        <p id="status" class="status" role="status"></p>
      </section>
    </div>
    <section class="fallback" aria-labelledby="fallback-heading">
      <h2 id="fallback-heading">Markdown 回退</h2>
      <p>无交互能力的 CLI / Markdown 客户端可展示：核心线程数 <strong>4</strong>，最大线程数（演示公式）<strong>8</strong>。完整版本见 <code>examples/thread-pool.md</code>。</p>
      <p class="muted">提示：最大线程数 = 核心线程数 × 2 只是交互演示公式，生产配置必须结合实际任务和压测。</p>
    </section>
  </main>
  <script src="./renderer.js" defer></script>
</body>
</html>
