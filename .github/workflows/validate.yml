name: Validate Gen UI Skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Skill and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Fetch exact public Git sources for offline P1 tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content ./evals/unseen-panorama-2026-11-17.json -Raw | ConvertFrom-Json
          $allowed = @("agent-lead", "plan-ship", "distributed-system-audit")
          $projectsRoot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "../.."))
          foreach ($case in $manifest.cases) {
            if ($case.repo -notin $allowed -or $case.commit -notmatch "^[a-f0-9]{40}$") { throw "Untrusted P1 source manifest" }
            $target = Join-Path $projectsRoot $case.repo
            if (Test-Path $target) { throw "Source target already exists: $target" }
            & git -c credential.helper= clone --quiet --no-checkout "https://github.com/yeqiana/$($case.repo).git" $target
            if ($LASTEXITCODE -ne 0) { throw "Cannot fetch public frozen repo: $($case.repo)" }
            & git -C $target cat-file -e "$($case.commit)^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "Pinned commit unavailable: $($case.repo)" }
          }
      - name: Validate Skill package and examples
        shell: pwsh
        run: ./scripts/test-skill.ps1
      - name: Build and verify P1 human-review packet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $projectsRoot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "../.."))
          $packet = Join-Path $env:RUNNER_TEMP "genui-p1-human-review-80"
          & node ./scripts/build-p1-human-handoff.mjs $packet $projectsRoot
          if ($LASTEXITCODE -ne 0) { throw "P1 human-review packet build failed" }
          & node ./scripts/verify-p1-human-handoff.mjs $packet
          if ($LASTEXITCODE -ne 0) { throw "P1 human-review packet verification failed" }
      - name: Upload P1 human-review packet (80 pending items)
        uses: actions/upload-artifact@v4
        with:
          name: gen-ui-p1-human-review-80-items
          path: ${{ runner.temp }}/genui-p1-human-review-80/
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Browser QA (Chrome, 375/768/1440px)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Verify Chrome install
        shell: pwsh
        env:
          GEN_UI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: '& $env:GEN_UI_CHROME --version'
      - name: Run actual Chrome smoke suites
        shell: pwsh
        env:
          GEN_UI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = @(
            "tests/chrome-report-smoke.mjs",
            "tests/chrome-portal-smoke.mjs",
            "tests/chrome-portal-http-smoke.mjs",
            "tests/chrome-portal-directory-smoke.mjs",
            "tests/chrome-documents-smoke.mjs",
            "tests/chrome-typography-smoke.mjs",
            "tests/chrome-real-generated-typography.mjs",
            "tests/chrome-heading-break-smoke.mjs",
            "tests/chrome-heading-wrap-regression.mjs",
            "tests/chrome-prose-alignment-regression.mjs",
            "tests/chrome-layout-edge-cases.mjs",
            "tests/chrome-semantic-stress.mjs"
          )
          foreach ($script in $scripts) {
            & node $script
            if ($LASTEXITCODE -ne 0) { throw "Browser smoke failed: $script" }
          }
          & node tests/chrome-semantic-stress.mjs --mobile
          if ($LASTEXITCODE -ne 0) { throw "Mobile semantic stress failed" }
          foreach ($case_id in @("HTML02","HTML03","HTML04")) {
            $inputPath = "evals/artifacts/${case_id}-webcodex-gpt6-20261106/report.html"
            $reportPath = Join-Path $env:RUNNER_TEMP "${case_id}-browser-evidence.json"
            & node tests/chrome-agent-output-smoke.mjs --case $case_id --input $inputPath --report $reportPath
            if ($LASTEXITCODE -ne 0) { throw "Agent browser QA failed: $case_id" }
          }