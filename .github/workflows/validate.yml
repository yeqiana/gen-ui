name: Validate Gen UI Skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Skill and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate Skill package and examples
        shell: pwsh
        run: ./scripts/test-skill.ps1

  browser:
    name: Browser QA (Chrome, 375/768/1440px)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Verify Chrome install
        shell: pwsh
        env:
          GEN_UI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: '& $env:GEN_UI_CHROME --version'
      - name: Run actual Chrome smoke suites
        shell: pwsh
        env:
          GEN_UI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = @(
            "tests/chrome-report-smoke.mjs",
            "tests/chrome-portal-smoke.mjs",
            "tests/chrome-portal-http-smoke.mjs",
            "tests/chrome-portal-directory-smoke.mjs",
            "tests/chrome-documents-smoke.mjs"
          )
          foreach ($script in $scripts) {
            & node $script
            if ($LASTEXITCODE -ne 0) { throw "Browser smoke failed: $script" }
          }
          foreach ($case_id in @("HTML02","HTML03","HTML04")) {
            $inputPath = "evals/artifacts/${case_id}-webcodex-gpt6-20261106/report.html"
            $reportPath = Join-Path $env:RUNNER_TEMP "${case_id}-browser-evidence.json"
            & node tests/chrome-agent-output-smoke.mjs --case $case_id --input $inputPath --report $reportPath
            if ($LASTEXITCODE -ne 0) { throw "Agent browser QA failed: $case_id" }
          }