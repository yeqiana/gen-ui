name: Publish GEN-UI install package
on:
  push:
    tags: ['gen-ui-install-*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build install ZIP
        run: python3 scripts/build-skill-package.py "$RUNNER_TEMP/gen-ui-lite.zip"
      - name: Publish versioned installation asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "$RUNNER_TEMP/gen-ui-lite.zip" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "GEN-UI installation ${GITHUB_REF_NAME}" --notes "Standard YAML Skill discovery; lightweight install package. See README for usage and verified limitations."
