<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>长文本与筛选边界 · 模拟测试报告</title>
<style>
:root{font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#252525;background:#fff}
*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}.sidebar{background:#fafafa;border-right:1px solid #eee;padding:26px 14px}.brand{font-size:16px;font-weight:700;letter-spacing:.05em;padding:0 9px 20px}.brand svg{vertical-align:middle;margin-right:7px}.sidebar nav{display:grid;gap:3px}.sidebar nav a{padding:9px 10px;color:#555;text-decoration:none;border-radius:5px}.sidebar nav a:hover{background:#ededed}
.main{min-width:0;padding:clamp(18px,3.5vw,50px)}h1{font-size:27px;margin:3px 0 9px;font-weight:600}h2{font-size:18px;font-weight:600;margin:32px 0 12px}.muted{color:#777;font-size:13px}.statement{border-left:2px solid #777;padding-left:12px;margin:12px 0 24px}.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:20px 0 14px}.field{display:grid;gap:5px;flex:1 1 145px}.field label{color:#666;font-size:12px}select,input{height:38px;padding:7px 9px;border:1px solid #c9c9c9;border-radius:4px;background:white;min-width:0}.field select,.field input{width:100%}button{border:1px solid #bdbdbd;background:#fff;color:#333;border-radius:5px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.45}button:focus-visible,select:focus-visible,input:focus-visible,.clip:focus-visible{outline:2px solid #444;outline-offset:2px}
.summary{border-block:1px solid #eaeaea;display:flex;flex-wrap:wrap;gap:24px;padding:14px 0}.summary strong{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.summary span{color:#777;font-size:12px}.summary div{display:grid}
.table-shell{border-top:1px solid #e7e7e7}.scroll{overflow-x:auto;max-width:100%;outline-offset:2px}table{width:100%;min-width:1020px;border-collapse:separate;border-spacing:0}th,td{padding:10px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid #ededed;max-width:310px;font-size:13px}th{background:#f7f7f7;font-weight:600;color:#555}th:first-child,td:first-child{position:sticky;left:0;background:white;z-index:2;border-right:1px solid #e7e7e7}th:first-child{background:#f7f7f7;z-index:3}tr:hover td{background:#fcfcfc}tr:hover td:first-child{background:#fcfcfc}.clip{max-width:230px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;display:block}.clip[data-clipped="true"]{cursor:help}.cell-tooltip{position:fixed;display:none;z-index:40;pointer-events:none;background:#262626;color:#fff;padding:7px 10px;max-width:min(420px,calc(100vw - 20px));overflow-wrap:anywhere;border-radius:5px;font-size:13px;box-shadow:0 5px 16px #0002}
.pager{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-top:14px}.pager-controls{display:flex;align-items:center;gap:8px}.empty{padding:24px;text-align:center;color:#777}
@media(max-width:700px){.layout{display:block}.sidebar{padding:9px 14px;border-bottom:1px solid #eee}.brand{padding:0 4px 5px;font-size:14px}.sidebar nav{display:flex;gap:5px;flex-wrap:wrap}.sidebar nav a{padding:5px 8px;font-size:12px}.main{padding:19px 13px}h1{font-size:21px}}
</style></head><body>
<div class="layout"><aside class="sidebar"><div class="brand"><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="#333" d="M3 10 4 2l6 5h4l6-5 1 8q5 11-9 12Q-1 21 3 10Z"/></svg>GEN-UI</div><nav aria-label="报告目录"><a href="#overview">概览</a><a href="#records">任务明细</a><a href="#notes">数据口径</a></nav></aside>
<main class="main"><section id="overview"><p class="muted">HTML02 · 模拟数据 · Agent 输出评测</p><h1>长文本与筛选边界</h1><p class="statement">本报告全部 36 条记录与测试结论均为模拟，不代表真实系统执行结果。</p>
<div class="summary"><div><span>模拟记录总数</span><strong>36</strong></div><div><span>筛选后记录</span><strong id="filtered-count" aria-live="polite">36</strong></div><div><span>含 all 的合法模块</span><strong>all</strong></div></div></section>
<section id="records"><h2>任务明细</h2>
<div class="toolbar" role="search" aria-label="任务筛选">
<div class="field"><label for="module">模块名称</label><select id="module"><option value="">全部模块</option><option value="all">all</option><option value="订单服务">订单服务</option><option value="全链路链路治理组件与超长模块名称用于截断测试">全链路链路治理组件与超长模块名称用于截断测试</option></select></div>
<div class="field"><label for="keyword">编号 / 说明</label><input id="keyword" type="search" placeholder="搜索编号或文本"></div>
<div class="field"><label for="state">状态</label><select id="state"><option value="">全部状态</option><option value="已完成">已完成</option><option value="待处理">待处理</option></select></div>
<button id="reset" type="button">清空筛选</button></div>
<div class="table-shell"><div class="scroll" id="scroll" tabindex="0" aria-label="表格可横向滚动"><table><caption style="position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden">模拟测试表格</caption><thead><tr><th scope="col">任务编号</th><th scope="col">模块名称</th><th scope="col">状态</th><th scope="col">模拟批次</th><th scope="col">说明</th></tr></thead><tbody id="tbody"></tbody></table></div><p id="empty" class="empty" hidden>暂无符合条件的模拟记录</p></div>
<div class="pager"><label for="page-size">每页显示 <select id="page-size"><option value="20">20</option><option value="50">50</option><option value="100">100</option></select></label><div class="pager-controls"><span id="page-info" aria-live="polite">第 1 / 2 页</span><button id="prev" type="button">上一页</button><button id="next" type="button">下一页</button></div></div></section>
<section id="notes"><h2>数据口径</h2><p class="muted">all 是合法的真实模块名称，全部模块选项使用空值作为哨兵。截断仅由实际渲染尺寸判断，避免给未截断单元格增加无用 Tab 停靠点。长文本显示全文不修改源值。</p></section></main></div><div class="cell-tooltip" id="tooltip" role="tooltip"></div>
<script>
"use strict";(()=>{
const modules=["all","订单服务","全链路链路治理组件与超长模块名称用于截断测试"];
const data=Array.from({length:36},(_,i)=>({id:"T-"+String(i+1).padStart(3,"0"),module:modules[i%3],status:i%2===0?"已完成":"待处理",batch:1+(i%4),note:i%3===2?"用于验证自适应截断、键盘焦点、浮动全文边界以及移动设备横向滚动行为的非常长的模拟说明文本":i%3===0?"all 是实际模块值，不能当作全部模块":"常规模拟任务说明"}));
const $=id=>document.getElementById(id),sel=$("module"),kw=$("keyword"),state=$("state"),size=$("page-size"),tip=$("tooltip");let page=1;
const mk=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;};
function rows(){const k=kw.value.trim().toLowerCase();return data.filter(r=>(!sel.value||r.module===sel.value)&&(!state.value||r.status===state.value)&&(!k||r.id.toLowerCase().includes(k)||r.note.toLowerCase().includes(k)));}
function hide(){tip.style.display="none";tip.textContent="";}
function clipped(el){return el.scrollWidth>el.clientWidth+1;}
function show(el){if(!clipped(el))return;tip.textContent=el.textContent;tip.style.display="block";const b=el.getBoundingClientRect();const t=tip.getBoundingClientRect();tip.style.left=Math.max(10,Math.min(innerWidth-t.width-10,b.left))+"px";tip.style.top=(b.bottom+8+t.height<=innerHeight-10?b.bottom+8:Math.max(10,b.top-t.height-8))+"px";}
function applyFocus(){for(const e of document.querySelectorAll("#tbody .clip")){const isCut=clipped(e);e.tabIndex=isCut?0:-1;e.dataset.clipped=String(isCut);if(isCut)e.setAttribute("aria-label","查看完整内容："+e.textContent);else e.removeAttribute("aria-label");}}
function render(){hide();const matched=rows(),per=Number(size.value),total=Math.max(1,Math.ceil(matched.length/per));page=Math.min(page,total);
$("tbody").replaceChildren();for(const r of matched.slice((page-1)*per,page*per)){const tr=mk("tr");for(const val of [r.id,r.module,r.status,"第 "+r.batch+" 批",r.note]){const td=mk("td"),span=mk("span",val,"clip");span.title=String(val);span.addEventListener("mouseenter",()=>show(span));span.addEventListener("mouseleave",hide);span.addEventListener("focus",()=>show(span));span.addEventListener("blur",hide);td.append(span);tr.append(td);}$("tbody").append(tr);}
$("filtered-count").textContent=matched.length;$("empty").hidden=matched.length!==0;$("page-info").textContent="第 "+page+" / "+total+" 页，共 "+matched.length+" 条模拟记录";$("prev").disabled=page===1;$("next").disabled=page>=total;applyFocus();requestAnimationFrame(applyFocus);}
for(const el of [sel,state,size])el.addEventListener("change",()=>{page=1;render()});
kw.addEventListener("input",()=>{page=1;render()});$("reset").addEventListener("click",()=>{sel.value="";state.value="";kw.value="";size.value="20";page=1;render()});
$("prev").addEventListener("click",()=>{if(page>1){page--;render()}});$("next").addEventListener("click",()=>{page++;render()});
$("scroll").addEventListener("scroll",hide);window.addEventListener("scroll",hide,{passive:true});window.addEventListener("resize",()=>{hide();applyFocus()});render();
})();
</script></body></html>
