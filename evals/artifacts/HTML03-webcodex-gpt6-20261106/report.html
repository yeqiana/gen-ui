<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模拟任务管理 · GEN-UI</title><style>
:root{font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#292929;background:white}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,[role=tab]:focus-visible{outline:2px solid #444;outline-offset:2px}
.layout{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:100vh}.rail{padding:24px 14px;background:#fafafa;border-right:1px solid #eee}.brand{font-weight:700;font-size:16px;letter-spacing:.07em;margin:0 0 24px 10px}.rail nav{display:grid;gap:5px}.rail nav a{color:#555;text-decoration:none;padding:10px 12px;border-radius:5px}.rail nav a:hover{background:#eee}.content{padding:32px clamp(14px,3vw,46px);min-width:0}h1{font-size:25px;font-weight:600;margin:8px 0}h2{font-size:17px;font-weight:600;margin:29px 0 13px}.muted{color:#747474;font-size:12px}.notice{border-left:2px solid #777;padding-left:10px;margin:13px 0 24px}.topline{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.button{padding:7px 13px;border:1px solid #bcbcbc;border-radius:5px;background:white;color:#282828}.button.primary{background:#292929;color:white;border-color:#292929}.button:disabled{opacity:.4}.link-out{color:#555;font-size:12px}.link-out:hover{color:#111}
.tabs{display:flex;gap:18px;border-bottom:1px solid #e8e8e8}.tab{border:0;background:transparent;color:#6d6d6d;padding:11px 5px;border-bottom:2px solid transparent}.tab[aria-selected=true]{border-bottom-color:#282828;color:#222;font-weight:600}.tabpanel{padding:16px 0 2px}.stats{display:flex;flex-wrap:wrap;gap:28px;padding:14px 0}.stat{display:grid;gap:2px}.stat strong{font-size:24px;font-weight:600}.stat label{font-size:12px;color:#777}
.filters{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin:12px 0}.field{display:grid;gap:4px;flex:1 1 130px}.field label{color:#666;font-size:12px}.field input,.field select{height:38px;width:100%;padding:6px 9px;border:1px solid #c5c5c5;border-radius:4px;background:white}
.table-scroll{overflow-x:auto;width:100%;outline-offset:2px}table{border-collapse:separate;border-spacing:0;min-width:780px;width:100%}th,td{font-size:13px;white-space:nowrap;padding:11px 14px;text-align:left;border-bottom:1px solid #ececec}th{background:#f8f8f8;font-weight:600;color:#555}th:first-child,td:first-child{position:sticky;left:0;background:white;z-index:2;border-right:1px solid #eee}th:first-child{background:#f8f8f8;z-index:3}.empty{color:#888;text-align:center;padding:25px}.pagination{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:14px 0}.pagination select{padding:6px;border:1px solid #c5c5c5}.pagination-buttons{display:flex;gap:7px;align-items:center}
dialog{border:0;padding:0;box-shadow:0 16px 60px #0002;border-radius:6px;max-width:min(520px,calc(100vw - 30px));width:100%;color:#292929}dialog::backdrop{background:rgba(0,0,0,.24)}dialog header{padding:19px 23px 8px}dialog h2{margin:0;font-size:19px}.dialog-content{padding:14px 23px 4px}.dialog-content .field{margin-bottom:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;padding:15px 23px 21px}.field-error{color:#b23b3b;font-size:12px;min-height:18px}dialog.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(420px,96vw);border-radius:0}.drawer dl{margin:0}.drawer dt{font-size:12px;color:#888;margin-top:13px}.drawer dd{margin:3px 0;font-size:15px;overflow-wrap:anywhere}.feedback{min-height:25px;color:#286444;font-size:13px}
@media(max-width:720px){.layout{display:block}.rail{padding:10px 15px}.rail nav{display:flex;flex-wrap:wrap}.rail nav a{padding:5px 8px}.brand{margin:0 0 6px}.content{padding:20px 13px}h1{font-size:21px}.tabs{gap:10px}}
</style></head><body>
<div class="layout"><aside class="rail"><div class="brand">GEN-UI</div><nav aria-label="页内导航"><a href="#overview">工作概览</a><a href="#records-section">记录管理</a><a href="#notes">说明</a></nav></aside>
<main class="content"><p class="muted">HTML03 · 离线交互验收 · 纯模拟数据</p><div class="topline"><h1>模拟任务管理</h1><a class="link-out" href="https://example.com/" target="_blank" rel="noopener noreferrer" aria-label="新标签页打开示例站点">新标签页打开示例站点 ↗</a></div>
<p class="notice">本页全部任务与指标为模拟数据，仅供检查交互能力，未连接实际业务系统。</p>
<section id="overview"><h2>工作概览</h2>
<div role="tablist" class="tabs" aria-label="管理视图">
<button id="tab-overview" class="tab" role="tab" type="button" aria-selected="true" aria-controls="panel-overview" tabindex="0">概览标签（页内）</button>
<button id="tab-records" class="tab" role="tab" type="button" aria-selected="false" aria-controls="panel-records" tabindex="-1">记录标签（页内）</button>
</div>
<section id="panel-overview" class="tabpanel" role="tabpanel" aria-labelledby="tab-overview"><div class="stats"><div class="stat"><label>任务总数（模拟）</label><strong id="total">24</strong></div><div class="stat"><label>已完成（模拟）</label><strong id="done">12</strong></div><div class="stat"><label>待处理（模拟）</label><strong id="todo">12</strong></div></div></section>
<section id="panel-records" class="tabpanel" role="tabpanel" aria-labelledby="tab-records" hidden><p>这是页内记录标签，不会跳转到新标签页。可使用下方表格和新增按钮完成管理演示。</p></section></section>
<section id="records-section"><div class="topline"><h2>记录管理</h2><button id="new" class="button primary" type="button">新增模拟记录</button></div>
<p class="feedback" id="feedback" role="status" aria-live="polite"></p>
<div class="filters" role="search" aria-label="模拟记录筛选"><div class="field"><label for="filter-id">任务编号</label><input type="search" id="filter-id" placeholder="编号包含"></div><div class="field"><label for="filter-group">所属分组</label><select id="filter-group"><option value="">全部分组</option><option value="研发">研发</option><option value="测试">测试</option><option value="运营">运营</option></select></div><div class="field"><label for="filter-status">任务状态</label><select id="filter-status"><option value="">全部状态</option><option value="已完成">已完成</option><option value="待处理">待处理</option></select></div><button id="reset" class="button" type="button">重置筛选</button></div>
<div class="table-scroll" tabindex="0" aria-label="模拟任务表格，支持横向滚动"><table><caption style="position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden">仅供示例的任务数据</caption><thead><tr><th scope="col">任务编号</th><th scope="col">任务名称</th><th scope="col">所属分组</th><th scope="col">任务状态</th><th scope="col">操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="empty" hidden>没有符合条件的模拟记录</p>
<div class="pagination"><label for="page-size">每页显示 <select id="page-size"><option value="20">20</option><option value="50">50</option><option value="100">100</option></select></label><div class="pagination-buttons"><span id="page-info" aria-live="polite"></span><button id="prev" class="button" type="button">上一页</button><button id="next" class="button" type="button">下一页</button></div></div>
</section><section id="notes"><h2>说明</h2><p class="muted">对话框、抽屉、页面内标签和外部新标签页互不混淆。输入无效时保留其他已填写内容，并将焦点移至需要修复的字段。</p></section></main></div>
<dialog id="create-dialog" aria-labelledby="create-title"><form id="create-form" novalidate><header><h2 id="create-title">新增模拟记录</h2></header><div class="dialog-content"><div class="field"><label for="new-id">任务编号</label><input id="new-id" name="id" required placeholder="例如 NEW-025" autocomplete="off"><span class="field-error" id="error-id"></span></div><div class="field"><label for="new-name">任务名称</label><input id="new-name" name="name" required placeholder="输入任务名称"><span class="field-error" id="error-name"></span></div><div class="field"><label for="new-group">所属分组</label><select id="new-group" name="group"><option value="研发">研发</option><option value="测试">测试</option><option value="运营">运营</option></select></div><div class="field"><label for="new-status">任务状态</label><select id="new-status" name="status"><option value="待处理">待处理</option><option value="已完成">已完成</option></select></div></div><div class="dialog-actions"><button id="cancel-create" class="button" type="button">取消</button><button class="button primary" type="submit">保存模拟记录</button></div></form></dialog>
<dialog id="detail-dialog" class="drawer" aria-labelledby="detail-title"><header><h2 id="detail-title">记录详情</h2></header><div class="dialog-content"><dl id="detail-fields"></dl></div><div class="dialog-actions"><button id="close-detail" type="button" class="button">关闭详情抽屉</button></div></dialog>
<script>
"use strict";(()=>{
const groups=["研发","测试","运营"],data=Array.from({length:24},(_,i)=>({id:"SIM-"+String(i+1).padStart(3,"0"),name:"模拟任务 "+(i+1),group:groups[i%3],status:i%2===0?"已完成":"待处理"}));
const $=id=>document.getElementById(id),list=$("rows"),form=$("create-form"),dialog=$("create-dialog"),drawer=$("detail-dialog");let page=1,lastDetailButton=null,lastCreateButton=null;
function notice(s){$("feedback").textContent=s;}
function tabsActive(index,focus){const ts=[$("tab-overview"),$("tab-records")];ts.forEach((t,i)=>{const on=index===i;t.setAttribute("aria-selected",String(on));t.tabIndex=on?0:-1;$(t.getAttribute("aria-controls")).hidden=!on;});if(focus)ts[index].focus();}
const tabs=[$("tab-overview"),$("tab-records")];tabs.forEach((t,i)=>{t.addEventListener("click",()=>tabsActive(i,false));t.addEventListener("keydown",e=>{let idx=-1;if(e.key==="ArrowRight")idx=(i+1)%tabs.length;else if(e.key==="ArrowLeft")idx=(i+tabs.length-1)%tabs.length;else if(e.key==="Home")idx=0;else if(e.key==="End")idx=tabs.length-1;if(idx!==-1){e.preventDefault();tabsActive(idx,true)}})});
function filter(){const id=$("filter-id").value.trim().toLowerCase(),group=$("filter-group").value,status=$("filter-status").value;return data.filter(r=>(!id||r.id.toLowerCase().includes(id))&&(!group||r.group===group)&&(!status||r.status===status));}
function text(tag,value){const e=document.createElement(tag);e.textContent=String(value);return e;}
function details(r,button){lastDetailButton=button;const dl=$("detail-fields");dl.replaceChildren();for(const [key,val] of [["编号",r.id],["名称",r.name],["分组",r.group],["状态",r.status]]){dl.append(text("dt",key),text("dd",val));}drawer.showModal();$("close-detail").focus();}
function render(){const rows=filter(),size=Number($("page-size").value),pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages);list.replaceChildren();
for(const r of rows.slice((page-1)*size,page*size)){const tr=document.createElement("tr");for(const field of ["id","name","group","status"]){const td=text("td",r[field]);tr.append(td)}const td=document.createElement("td"),button=text("button","查看详情");button.type="button";button.className="button";button.setAttribute("aria-label","查看任务 "+r.id+" 的详情");button.addEventListener("click",()=>details(r,button));td.append(button);tr.append(td);list.append(tr)}
$("total").textContent=data.length;$("done").textContent=data.filter(r=>r.status==="已完成").length;$("todo").textContent=data.filter(r=>r.status==="待处理").length;$("page-info").textContent="第 "+page+" / "+pages+" 页，共 "+rows.length+" 条模拟任务";$("prev").disabled=page<=1;$("next").disabled=page>=pages;$("empty").hidden=rows.length!==0;}
for(const id of ["filter-group","filter-status","page-size"])$(id).addEventListener("change",()=>{page=1;render()});$("filter-id").addEventListener("input",()=>{page=1;render()});$("reset").addEventListener("click",()=>{$("filter-id").value="";$("filter-group").value="";$("filter-status").value="";page=1;render()});$("prev").addEventListener("click",()=>{page--;render()});$("next").addEventListener("click",()=>{page++;render()});
$("new").addEventListener("click",e=>{lastCreateButton=e.currentTarget;form.reset();$("error-id").textContent="";$("error-name").textContent="";dialog.showModal();$("new-id").focus()});$("cancel-create").addEventListener("click",()=>dialog.close());dialog.addEventListener("close",()=>lastCreateButton?.focus());
form.addEventListener("submit",e=>{e.preventDefault();const id=$("new-id").value.trim(),name=$("new-name").value.trim(),group=$("new-group").value,status=$("new-status").value;let invalid=null;$("error-id").textContent="";$("error-name").textContent="";
if(!id||data.some(r=>r.id.toLowerCase()===id.toLowerCase())){$("error-id").textContent=!id?"编号不能为空":"编号已存在";invalid=$("new-id")}
if(!name){$("error-name").textContent="任务名称不能为空";if(!invalid)invalid=$("new-name")}if(invalid){invalid.focus();return}
data.push({id,name,group,status});$("filter-id").value="";$("filter-group").value="";$("filter-status").value="";page=Math.ceil(data.length/Number($("page-size").value));dialog.close();notice("已新增模拟记录 "+id+"，并定位到最新页");render();});
$("close-detail").addEventListener("click",()=>drawer.close());drawer.addEventListener("close",()=>{if(lastDetailButton?.isConnected)lastDetailButton.focus()});render();
})();
</script></body></html>
